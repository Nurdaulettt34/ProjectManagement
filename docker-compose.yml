# One command for the whole team:  docker compose up --build
# App: http://localhost:5000   Tests: docker compose run --rm web pytest
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uniflow
      POSTGRES_PASSWORD: uniflow
      POSTGRES_DB: uniflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniflow -d uniflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      APP_ENV: development
      # Values come from .env if it exists (compose reads it automatically).
      # The SECRET_KEY fallback is for local development only:
      # ProductionConfig refuses keys that start with "dev-".
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-sdu.edu.kz}
      # Email codes: without MAIL_SERVER the email is printed to this container's log.
      MAIL_BACKEND: ${MAIL_BACKEND:-}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      DATABASE_URL: postgresql+psycopg://uniflow:uniflow@postgres:5432/uniflow
      TEST_DATABASE_URL: postgresql+psycopg://uniflow:uniflow@postgres:5432/uniflow_test
    command: flask run --host=0.0.0.0 --port=5000 --debug
    volumes:
      - .:/app          # live reload while developing
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
